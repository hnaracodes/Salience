<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TRIBE cortical activation viewer</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f1115; color: #e8eaed; }
    #hud { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-bottom: 1px solid #2a2f3a; }
    #hud label { font-size: 14px; }
    #tSlider { width: min(480px, 60vw); vertical-align: middle; }
    #canvasHost { width: 100vw; height: calc(100vh - 56px); }
    canvas { display: block; width: 100%; height: 100%; }
    .meta { opacity: 0.85; font-size: 13px; }
    a { color: #7eb8ff; }
  </style>
</head>
<body>
  <div id="hud">
    <label>
      Timestep <span id="tLabel">0</span> / <span id="tMax">0</span>
      <input type="range" id="tSlider" min="0" max="0" value="0" step="1" />
    </label>
    <span class="meta" id="valueMeta">activation: —</span>
    <span class="meta">Drag to rotate · scroll to zoom</span>
  </div>
  <div id="canvasHost"></div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const params = new URLSearchParams(location.search);
    const base = params.get("base") || ".";

    async function loadBinary(url, dtype, count) {
      const res = await fetch(`${base}/${url}`);
      if (!res.ok) throw new Error(`Failed to load ${url}: ${res.status}`);
      const buf = await res.arrayBuffer();
      if (dtype === "float32") return new Float32Array(buf);
      if (dtype === "int32") return new Int32Array(buf);
      throw new Error(dtype);
    }

    function hotColor(t) {
      const r = Math.min(1, Math.max(0, 1.5 * t - 0.5));
      const g = Math.min(1, Math.max(0, 1.5 * t));
      const b = Math.min(1, Math.max(0, 4 * t - 2));
      return new THREE.Color(r, g * 0.35, b * 0.15);
    }

    const manifest = await (await fetch(`${base}/manifest.json`)).json();
    const { n_timesteps, n_vertices, n_faces, vmin, vmax } = manifest;

    const coords = await loadBinary("coords.bin", "float32");
    const faces = await loadBinary("faces.bin", "int32");
    const predsFlat = await loadBinary("preds.bin", "float32");

    document.getElementById("tMax").textContent = String(n_timesteps - 1);
    const slider = document.getElementById("tSlider");
    slider.max = String(Math.max(0, n_timesteps - 1));

    const host = document.getElementById("canvasHost");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1115);
    const camera = new THREE.PerspectiveCamera(45, host.clientWidth / host.clientHeight, 0.1, 2000);
    camera.position.set(0, 0, 320);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(host.clientWidth, host.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    host.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(n_vertices * 3);
    for (let i = 0; i < n_vertices; i++) {
      positions[i * 3] = coords[i * 3];
      positions[i * 3 + 1] = coords[i * 3 + 2];
      positions[i * 3 + 2] = coords[i * 3 + 1];
    }
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setIndex(Array.from(faces));
    geometry.computeVertexNormals();

    const colors = new Float32Array(n_vertices * 3);
    geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

    const material = new THREE.MeshPhongMaterial({
      vertexColors: true,
      shininess: 20,
      side: THREE.DoubleSide,
    });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const dir = new THREE.DirectionalLight(0xffffff, 0.85);
    dir.position.set(200, 300, 400);
    scene.add(dir);

    const center = new THREE.Vector3();
    geometry.computeBoundingBox();
    geometry.boundingBox.getCenter(center);
    controls.target.copy(center);

    function setTimestep(t) {
      const row = predsFlat.subarray(t * n_vertices, (t + 1) * n_vertices);
      let maxVal = -Infinity;
      let maxIdx = 0;
      for (let v = 0; v < n_vertices; v++) {
        const val = row[v];
        if (val > maxVal) { maxVal = val; maxIdx = v; }
        const norm = (val - vmin) / (vmax - vmin + 1e-8);
        const c = hotColor(Math.min(1, Math.max(0, norm)));
        colors[v * 3] = c.r;
        colors[v * 3 + 1] = c.g;
        colors[v * 3 + 2] = c.b;
      }
      geometry.attributes.color.needsUpdate = true;
      document.getElementById("tLabel").textContent = String(t);
      document.getElementById("valueMeta").textContent =
        `t=${t}s (index) · peak vertex ${maxIdx} = ${maxVal.toFixed(4)} · range [${vmin.toFixed(3)}, ${vmax.toFixed(3)}]`;
    }

    slider.addEventListener("input", () => setTimestep(Number(slider.value)));
    setTimestep(0);

    function onResize() {
      const w = host.clientWidth;
      const h = host.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener("resize", onResize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
