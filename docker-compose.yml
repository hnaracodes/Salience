version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://scout:scout@postgres:5432/scout
      REDIS_URL: redis://redis:6379
      # Local dev: MinIO stands in for Backblaze B2 (legacy R2_* names via services/infra/config.py)
      R2_ENDPOINT_URL: http://minio:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_BUCKET: scout
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://localhost:3002","http://localhost:3003"]'
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://scout:scout@postgres:5432/scout
      REDIS_URL: redis://redis:6379
      # Local dev: MinIO stands in for Backblaze B2 (legacy R2_* names via services/infra/config.py)
      R2_ENDPOINT_URL: http://minio:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_BUCKET: scout
      R2_PUBLIC_ENDPOINT_URL: http://127.0.0.1:9000
      R2_PUBLIC_URL: http://127.0.0.1:9000/scout
      FAKE_TRIBE: "1"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
    depends_on:
      - redis
      - postgres
      - api

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: scout
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb local/scout --ignore-existing;
      mc anonymous set download local/scout/scans;
      printf '[{\"AllowedOrigin\":[\"*\"],\"AllowedMethod\":[\"GET\",\"HEAD\"],\"AllowedHeader\":[\"*\"],\"ExposeHeader\":[\"ETag\",\"Content-Length\",\"Content-Type\"]}]' > /tmp/scout-cors.json;
      mc cors set local/scout /tmp/scout-cors.json;
      echo minio_init_dev: bucket scout ready;
      "
    restart: "no"

volumes:
  pgdata:
  miniodata:
