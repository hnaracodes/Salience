categories:
- amusement
- awe
- contentment
- excitement
- fear
- anger
- sadness
- confusion
cortical_reducers:
- mean
- std
cv:
  n_bootstrap: 50
  n_permutations: 25
  scheme: leave_one_video_out
data:
