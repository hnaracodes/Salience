feature_spec: fused_schaefer400_subcortical_v1
cortical_reducers:
  - mean
  - std
include_subcortical: true
window_trs: 1
cv:
  scheme: leave_one_video_out
  n_permutations: 100
  n_bootstrap: 500
target_type: product_8
ridge:
  alphas:
    - 0.01
    - 0.1
    - 1.0
    - 10.0
    - 100.0
model_id: horikawa_ridge_v1
categories:
  - amusement
  - awe
  - contentment
  - excitement
  - fear
  - anger
  - sadness
  - confusion
data:
  train_npz: scout_data/horikawaCode/tribev2_fused/train.npz
  reports_dir: scout_data/horikawaCode/reports
  cv_report_name: train_cv_meta_v1.json
  eval_report_name: eval_ablation_v1.json
