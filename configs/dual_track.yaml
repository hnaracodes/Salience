engagement:
  # Z-score thresholds for engagement labels (±1.5 = conservative; use ±1.0 for noisier website demos)
  threshold_high: 1.5
  threshold_low: -1.5
  # Agentic grounding fires when engagement_score exceeds this
  grounding_trigger: 2.0
  # Minimum baseline TRs required; fewer → "insufficient_baseline" flag, Track 1 labels suppressed
  min_baseline_trs: 30
  # Coarse Yeo-7 network keys; matched as prefix against Schaefer subnetworks in vertex_regions.csv
  # (e.g. SalVentAttn → SalVentAttn_ParOper, Default → Default_PFC)
  van_network_name: "SalVentAttn"
  dmn_network_name: "Default"

activation:
  # Track 3 — mean(|preds|) attention proxy (ViralAnalyser-style)
  threshold_high: 1.0
  threshold_low: -1.0
  min_baseline_trs: 30

baseline:
  # Generated by: modal run tribe.py::record_baseline  (from gray background.mp4)
  preds_path: "scout_data/baseline/preds_baseline.npz"
  source_video: "gray background.mp4"
  # Optional multi-clip corpus: place npz files + corpus_manifest.json under scout_data/baseline/
  corpus_id: "neutral_browsing_v1"

normalization:
  method: "robust_mad"   # robust_mad | mean_std
  min_scale_eps: 1.0e-6

emotion:
  # template | decoder — decoder requires preds_subcortical.npz + scout_models bundle
  # Production Track 2 stays template until UX validation passes (validation_study.yaml).
  mode: template
  # When true and mode=template, also compute supervised decoder into emotion_decoder_track
  # (separate bundle field; does not affect grounding triggers or SQLite emotion_trace).
  parallel_decoder: true
  model_id: horikawa_ridge_v1
  window_trs: 1
  feature_spec: fused_schaefer400_subcortical_v1
  require_subcortical: true
  prob_grounding_threshold: 0.5
  # Directory containing downloaded + resampled .npy templates (relative to project root)
  template_dir: "configs/emotion_templates"
  # Native Kragel & LaBar (2015) labels from NeuroVault collection #12383.
  # Ordered list — index position matches column in cosine_scores output.
  template_names:
    - contentment
    - amusement
    - surprise
    - fear
    - anger
    - sadness
    - neutral
  # Agentic grounding fires when any emotion session-relative Z exceeds this
  grounding_z_trigger: 1.0

output:
  # Written to scout_data/sessions/<id>/analysis_bundle.json
  analysis_bundle_filename: "analysis_bundle.json"
  # If true, existing analysis_bundle.json is merged rather than replaced
  merge_existing: true

# Display-only 0–100 marketing layer (does not change scores above):
# configs/marketing_scores.yaml — built by analyze_session.py --website/--sections
