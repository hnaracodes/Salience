# Manual section overrides for marketing analytics (hybrid with auto landmarks).
# Keys are hostnames (no scheme). Selectors match Playwright dom_id or CSS id/class strings.

sites:
  example.com:
    sections:
      - id: hero
        selectors: ["#hero", "[data-section=hero]", ".hero"]
      - id: pricing
        selectors: ["#pricing", "#pricing-table", "[data-section=pricing]"]
      - id: checkout
        selectors: ["#checkout", ".checkout-form"]

  localhost:
    default_script: localhost_demo.yaml
    sections:
      - id: main_content
        selectors: ["main", "#main", "[role=main]"]

  127.0.0.1:
    default_script: aurora_showcase.yaml
    sections:
      - id: hero
        selectors: ["#hero", "[data-section=hero]"]
      - id: experience
        selectors: ["#experience", "[data-section=experience]"]
      - id: gallery
        selectors: ["#gallery", "[data-section=gallery]"]
      - id: pricing
        selectors: ["#pricing", "[data-section=pricing]"]
      - id: cta
        selectors: ["#cta", "[data-section=cta]"]
      - id: main_content
        selectors: ["main", "#main", "[role=main]"]
