# Cinematic Aurora fixture — linear scroll capture (recommended).
# Serve: python -m http.server 8765 --directory tests/fixtures/walkthrough_site
#
# scroll_mode: linear — fixed scroll increment per TR; TR count = f(page height).
# Each TR saves a Playwright JPEG frame aligned with DOM snapshot + heatmap.

name: aurora_showcase
initial_url: "http://127.0.0.1:8765/index.html"
viewport:
  width: 1280
  height: 720

scroll_mode: linear
interval_sec: 1.0
scroll_px_per_tr: 540          # 75% of viewport height per TR
scroll_settle_ms: 600          # wait for scroll + reveal animations
initial_settle_ms: 1800        # wait after first load before TR 0

# duration_sec omitted — computed from page scroll height

site_goal: |
  Aurora is a cinematic product landing page. It should make visitors feel the product is
  fast, polished, and trustworthy — building enough excitement and clarity that they
  click the primary call-to-action to start using it.
